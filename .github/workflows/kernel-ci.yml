name: SAND OS — Native Boot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-boot:
    name: Build custom boot chain and test in QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install host build tools and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils qemu-system-x86
      - name: Build and validate SAND boot image
        run: |
          make clean
          make check
          test "$(stat -c%s build/sand-boot.bin)" -eq 512
          test "$(od -An -tx1 -j510 -N2 build/sand-boot.bin | tr -d ' \n')" = "55aa"
          test "$(stat -c%s build/sand-stage2.bin)" -eq 8192
          test "$(stat -c%s build/sand-os.img)" -eq 74240
      - name: Boot raw disk image and assert kernel self-tests
        shell: bash
        run: |
          set -euo pipefail
          qemu-system-i386 -machine pc -m 128M \
            -drive file=build/sand-os.img,format=raw,if=ide \
            -display none -no-reboot -no-shutdown \
            -debugcon file:build/debug.log -global isa-debugcon.iobase=0xe9 \
            -monitor unix:build/qemu-monitor.sock,server,nowait \
            -serial file:build/serial.log >build/qemu.log 2>&1 &
          QEMU_PID=$!
          cleanup() { kill "$QEMU_PID" 2>/dev/null || true; wait "$QEMU_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 40); do
            [[ -S build/qemu-monitor.sock ]] && break
            sleep 0.25
          done
          test -S build/qemu-monitor.sock
          for attempt in $(seq 1 160); do
            if grep -q 'SAND_TEST:ALL_PASS' build/debug.log 2>/dev/null; then break; fi
            if grep -Eq 'SAND_TEST:.*(FAIL|REJECTED)' build/debug.log 2>/dev/null; then cat build/debug.log; exit 1; fi
            sleep 0.25
          done
          cat build/debug.log
          grep -q 'SAND_TEST:BOOT' build/debug.log
          grep -q 'SAND_TEST:BLOCK_WAKE_PASS' build/debug.log
          grep -q 'SAND_TEST:MUTEX_COUNTER_PASS' build/debug.log
          grep -q 'SAND_TEST:REUSE_PASS' build/debug.log
          grep -q 'SAND_TEST:RING3_SETUP' build/debug.log
          grep -q 'SAND_TEST:RING3_ENTER' build/debug.log
          grep -q 'SAND_TEST:RING3_SYSCALL_PASS' build/debug.log
          grep -q 'SAND_TEST:ALL_PASS' build/debug.log
          python3 - <<'PY'
          import socket, time
          s = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          s.settimeout(4)
          s.connect("build/qemu-monitor.sock")
          time.sleep(0.2)
          try:
              s.recv(4096)
          except TimeoutError:
              pass
          s.sendall(b"screendump build/sand-os-screenshot.ppm\n")
          time.sleep(1)
          try:
              print(s.recv(4096).decode(errors="replace"))
          except TimeoutError:
              pass
          s.sendall(b"quit\n")
          s.close()
          PY
          sleep 1
          test -s build/sand-os-screenshot.ppm
      - name: Upload boot image and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sand-os-native-boot-${{ github.run_number }}
          path: |
            build/sand-os.img
            build/sand-boot.bin
            build/sand-stage2.bin
            build/sand-kernel.elf
            build/sand-kernel.bin
            build/sand-os-screenshot.ppm
            build/debug.log
            build/serial.log
            build/qemu.log
          if-no-files-found: warn
          retention-days: 14
